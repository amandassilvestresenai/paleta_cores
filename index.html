<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de Cores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Paleta de Cores</h1>
    <div id="tela-pintura"></div>
    <h3></h3>
    <p>Clique em uma das cores abaixo para pintar a tela</p>
    <div id="paleta">
        <div id="pincel-lilas" class="pincel" style="background-color: rgb(173, 10, 227);"></div>
        <div id="pincel-verdeagua" class="pincel" style="background-color: rgb(9, 244, 248);"></div>
        <div id="pincel-vermelho" class="pincel" style="background-color: rgb(255, 0, 0);"></div>
        <div id="pincel-laranja" class="pincel" style="background-color: rgb(255, 153, 0);"></div>
        <div id="pincel-marrom" class="pincel" style="background-color: rgb(109, 62, 8);"></div>
        <div id="pincel-preto" class="pincel" style="background-color: rgb(0, 0, 0);"></div>
        <div id="pincel-amarelo" class="pincel" style="background-color: rgb(238, 255, 0);"></div>
        <div id="pincel-rosa" class="pincel" style="background-color: rgb(255, 0, 179);"></div>
        <div id="pincel-verde" class="pincel" style="background-color: rgb(31, 205, 34);"></div>
    </div>
<script src="script.js"></script>
</body>
</html>
